<section class="auth-card" aria-labelledby="setup-title">
  <span class="eyebrow">{{ i18n.text('setupBadge') }}</span>
  <h1 id="setup-title">{{ i18n.text('setupTitle') }}</h1>
  <p class="intro">{{ i18n.text('setupIntro') }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="busy()">
    <label for="fullName">{{ i18n.text('name') }}</label>
    <input id="fullName" formControlName="fullName" autocomplete="name" maxlength="255" required />
    <label for="username">{{ i18n.text('username') }}</label>
    <input
      id="username"
      formControlName="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      maxlength="64"
      aria-describedby="username-help"
      required
    />
    <small id="username-help">{{ i18n.text('usernameHelp') }}</small>
    <label for="password">{{ i18n.text('password') }}</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="new-password"
      aria-describedby="password-help"
      required
    />
    <small id="password-help">{{ i18n.text('passwordHelp') }}</small>
    <label for="confirmation">{{ i18n.text('confirm') }}</label>
    <input
      id="confirmation"
      type="password"
      formControlName="confirmation"
      autocomplete="new-password"
      required
    />
    @if (error(); as key) {
      <p class="error" role="alert">{{ i18n.text(key) }}</p>
    }
    <button class="primary" type="submit" [disabled]="busy()">
      {{ i18n.text(busy() ? 'creating' : 'create') }}
    </button>
  </form>
</section>
