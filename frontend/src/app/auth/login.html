<section class="auth-card" aria-labelledby="login-title">
  <span class="eyebrow">Docukore</span>
  <h1 id="login-title">{{ i18n.text('loginTitle') }}</h1>
  <p class="intro">{{ i18n.text('loginIntro') }}</p>
  @if (created) {
    <p class="notice" role="status">{{ i18n.text('created') }}</p>
  }
  @if (expired) {
    <p class="notice" role="status">{{ i18n.text('sessionExpired') }}</p>
  }
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="busy()">
    <label for="username">{{ i18n.text('loginIdentity') }}</label>
    <input
      id="username"
      formControlName="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      required
    />
    <label for="password">{{ i18n.text('password') }}</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      required
    />
    @if (error(); as key) {
      <p class="error" role="alert">{{ i18n.text(key) }}</p>
    }
    <button class="primary" type="submit" [disabled]="busy()">
      {{ i18n.text(busy() ? 'signingIn' : 'login') }}
    </button>
  </form>
  <p class="card-footer">
    <a routerLink="/register">{{ i18n.text('registerLink') }}</a>
  </p>
  <p class="card-footer">{{ i18n.text('privacy') }}</p>
</section>
