<div class="app-frame">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">+</span><span>Docukore</span>
    </div>
    <label class="language">
      <span>{{ i18n.text('language') }}</span>
      <select
        #language
        [attr.aria-label]="i18n.text('language')"
        [value]="i18n.language()"
        (change)="i18n.select(language.value)"
      >
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </label>
  </header>
  <main class="app-main"><router-outlet /></main>
  <footer>
    <span>{{ i18n.text('tagline') }}</span><span>{{ i18n.text('privacy') }}</span>
  </footer>
</div>
